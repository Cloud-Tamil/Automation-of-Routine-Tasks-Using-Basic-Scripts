# Safety-first configuration. Keep DRY_RUN=true until validated.
IDLE_THRESHOLD_MINUTES=60
DRY_RUN=true
MAX_TERMINATIONS_PER_SCAN=5
LOG_RETENTION_DAYS=30
LOG_DIR="/var/log/server-session-manager"

# Exact Linux usernames to protect. Add all admin and service accounts here.
PROTECTED_USERS=("root" "admin" "administrator" "postgres" "mysql" "oracle")

# Glob patterns for protected service/automation accounts.
PROTECTED_USER_PATTERNS=("svc_*" "service_*" "sql_*")

# Linux groups whose members are never terminated.
PROTECTED_GROUPS=("sudo" "wheel" "adm")

# Only logind sessions whose Service starts with sshd and Remote=yes are eligible.
# Disconnected/dead SSH transports are handled by sshd keepalive, not guessed here.
